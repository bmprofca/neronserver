services:
  neron-api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ipbx.rule=Host(`ipbx.bmtaxopc.com`)
      - traefik.http.routers.ipbx.entrypoints=websecure
      - traefik.http.routers.ipbx.tls.certresolver=letsencrypt
      - traefik.http.routers.ipbx.service=ipbx
      - traefik.http.services.ipbx.loadbalancer.server.port=5000
